name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependency review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: critical

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate environment
        env:
          VITE_ENABLE_MSW: true
        run: pnpm run check:env
      - name: Security headers policy
        run: pnpm run test:security-headers
      - name: Dependency policy
        run: pnpm run test:dependency-policy
      - name: Lint
        run: pnpm run lint
      - name: Structure conventions
        run: pnpm run check:structure
      - name: Typecheck
        run: pnpm run typecheck
      - name: Stylelint
        run: pnpm run stylelint
      - name: Contract tests
        run: pnpm run test:contracts
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps
      - name: Performance budgets
        run: pnpm run test:perf
      - name: Render performance benchmarks
        env:
          PERF_MAX_TABLE_RENDER_MS: 6000
          PERF_MAX_GRAPH_RENDER_MS: 6500
          PERF_PAGE_READY_TIMEOUT_MS: 30000
        run: pnpm run test:render-perf
      - name: Reliability policy
        run: pnpm run test:reliability
      - name: Release governance
        run: pnpm run test:release-governance
      - name: Generate SBOM
        run: pnpm run sbom:generate
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: artifacts/sbom.cdx.json
          if-no-files-found: error
      - name: Unit tests
        run: pnpm run test:coverage
      - name: E2E tests
        run: pnpm test:e2e
      - name: E2E auth tests
        run: pnpm run test:e2e:auth
      - name: E2E accessibility tests
        run: pnpm run test:e2e:a11y
      - name: Generate quality dashboard artifact
        run: pnpm run quality:dashboard
      - name: Upload quality dashboard artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quality-dashboard
          path: |
            artifacts/quality-dashboard.json
            artifacts/quality-dashboard.md
            artifacts/performance-budget.json
            artifacts/render-benchmark.json
            coverage/coverage-summary.json
          if-no-files-found: error
